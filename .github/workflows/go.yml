name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.27.0
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'
        cache: true

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Test
      run: go test -v ./...
